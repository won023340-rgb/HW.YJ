<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여주청년 이혜원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f2f2f7; -webkit-tap-highlight-color: transparent; }
        .bento-card {
            background: white;
            border-radius: 2rem;
            transition: transform 0.2s ease;
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
        }
        /* 모바일에서 영상이 잘리지 않는 16:9 가로 비율 */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }
        @media (min-width: 768px) {
            .video-container {
                aspect-ratio: 1 / 1;
                max-width: 1152px;
            }
        }
        .bento-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 flex flex-col items-center" onclick="unlockAudioContext()">

    <div class="w-full max-w-[500px] md:max-w-[1152px] space-y-5 flex flex-col items-center">
        
        <div class="bento-card video-container border-none shadow-xl" onclick="handleSound(event)">
            <video id="topVideo" src="main-bg.mp4" autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover"></video>
            
            <div id="muteBtn" class="absolute top-4 right-4 z-30 bg-white/90 text-gray-900 px-4 py-2 rounded-full font-black shadow-lg flex items-center gap-2 text-xs transition-all">
                <span id="muteIcon">🔇</span> <span id="muteText">소리 켜기</span>
            </div>
            
            <div id="clickGuide" class="absolute inset-0 flex items-center justify-center bg-black/20 z-10 pointer-events-none">
                <p class="text-white text-xs font-bold bg-black/60 px-4 py-2 rounded-xl backdrop-blur-md">터치하면 소리가 나옵니다</p>
            </div>
        </div>

        <div class="bento-card p-8 flex flex-col items-center text-center">
            <div class="text-5xl mb-4">💼</div>
            <h3 class="font-black text-3xl text-gray-900 mb-5 tracking-tighter">실무 전문가</h3>
            <div class="space-y-4">
                <p class="text-blue-600 font-black text-xl leading-tight">더불어민주당 여주양평 사무차장</p>
                <div class="text-gray-500 text-lg font-bold space-y-2 pt-4 border-t border-gray-100 text-left w-full inline-block">
                    <p>• 현) 민주평통 여주시 청년위원장</p>
                    <p>• 전) 21대 대선 여주 회계책임자</p>
                    <p>• 전) 푸르메재단 무이숲 재무팀</p>
                </div>
            </div>
        </div>

        <div class="bento-card bg-[#111827] text-white p-8">
            <h3 class="font-black text-3xl text-blue-500 mb-6 text-center tracking-tighter">핵심 역량</h3>
            <div class="space-y-4 px-2">
                <div class="border-l-4 border-blue-500 pl-4 py-1">
                    <span class="text-xl font-black block">회계 전문성</span>
                    <p class="text-blue-400 text-sm font-bold mt-1">숫자로 책임을 증명합니다.</p>
                </div>
                <div class="border-l-4 border-blue-500 pl-4 py-1">
                    <span class="text-xl font-black block">예산 관리</span>
                    <p class="text-blue-400 text-sm font-bold mt-1">세금의 흐름을 바로잡습니다.</p>
                </div>
                <div class="border-l-4 border-blue-500 pl-4 py-1">
                    <span class="text-xl font-black block">청년 정책</span>
                    <p class="text-blue-400 text-sm font-bold mt-1">떠나지 않아도 되는 여주</p>
                </div>
            </div>
        </div>

        <div class="w-full space-y-3">
            <a href="https://www.facebook.com/profile.php?id=61582088739118" target="_blank" class="bento-card bg-[#1877F2] text-white py-5 flex flex-row items-center justify-center gap-3 border-none shadow-lg">
                <span class="text-2xl">🔵</span>
                <span class="text-lg font-black">FACEBOOK</span>
            </a>
            <a href="https://www.youtube.com/@%EC%9D%B4%ED%98%9C%EC%9B%90TV" target="_blank" class="bento-card bg-blue-600 text-white py-5 flex flex-row items-center justify-center gap-3 border-none shadow-lg">
                <span class="text-2xl">🔴</span>
                <span class="text-lg font-black">이혜원TV</span>
            </a>
        </div>

        <footer class="text-center py-10 text-gray-400 text-[10px] font-bold tracking-widest opacity-50">
            © 2026 LEE HYE-WON. ALL RIGHTS RESERVED.
        </footer>
    </div>

    <script>
        const video = document.getElementById('topVideo');
        const icon = document.getElementById('muteIcon');
        const text = document.getElementById('muteText');
        const btn = document.getElementById('muteBtn');
        const guide = document.getElementById('clickGuide');

        function unlockAudioContext() {
            video.play();
            document.getElementById('secondVideo').play();
        }

        function handleSound(event) {
            if (video.muted) {
                video.muted = false;
                video.volume = 1.0;
                video.play();
                icon.innerText = "🔊";
                text.innerText = "소리 끄기";
                btn.classList.replace('bg-white/90', 'bg-blue-600');
                btn.classList.add('text-white');
                guide.style.display = 'none';
            } else {
                video.muted = true;
                icon.innerText = "🔇";
                text.innerText = "소리 켜기";
                btn.classList.replace('bg-blue-600', 'bg-white/90');
                btn.classList.remove('text-white');
            }
        }
    </script>
</body>
</html>
